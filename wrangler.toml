# Cloudflare Pages config.
#
# Not in use yet — the site is on GitHub Pages. This exists so the migration is
# a matter of running commands rather than working out what to write.
#
# See docs/migrate-to-cloudflare.md for the full runbook.

name = "bleepboard"
pages_build_output_dir = "dist"
compatibility_date = "2026-08-26"

# The play-counter Function at functions/api/play.ts needs this binding.
# It is the reason play counts do not work today: the Function is Cloudflare
# code sitting in a repo deployed to GitHub Pages, where it never runs.
#
# NOTE: this file is the source of truth for Pages config. Bindings set via the
# API or dashboard are WIPED on the next `wrangler pages deploy` if they are not
# also declared here — that cost an hour of debugging on 2026-08-26, when
# /api/play kept returning 500 because context.env.PLAYS was undefined.

[[kv_namespaces]]
binding = "PLAYS"
id = "e404cff7b9534d3ba39b16d31a5bb02d"

# --- Sound submissions (functions/api/submit.ts) ------------------------------
# The upload endpoint parks files here for review. Nothing in these stores is
# served to the public: the site only ever renders what review-submissions.mjs
# has promoted into src/content/.
#
# Create them before the first deploy that includes /submit/:
#   wrangler r2 bucket create bleepboard-submissions
#   wrangler kv namespace create SUBMISSIONS_KV
# then paste the KV id below. TURNSTILE_SECRET is a secret, not a var:
#   wrangler pages secret put TURNSTILE_SECRET

[[r2_buckets]]
binding = "SUBMISSIONS"
bucket_name = "bleepboard-submissions"

[[kv_namespaces]]
binding = "SUBMISSIONS_KV"
id = "" # TODO: from `wrangler kv namespace create SUBMISSIONS_KV`
